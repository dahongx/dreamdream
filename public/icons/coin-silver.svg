<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
  <!--
    Silver dollar — 银元（袁大头风），中央铸"银"字。
    冷银渐变 + 深色外环 + 中央高对比"银"字。
    用通用 serif 字体让各平台都能 fallback 出中文字形。
  -->
  <defs>
    <radialGradient id="silverFace" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="55%" stop-color="#b9c3d0"/>
      <stop offset="100%" stop-color="#5b6473"/>
    </radialGradient>
  </defs>
  <!-- 外环深色 -->
  <circle cx="10" cy="10" r="9.4" fill="#2a2f38"/>
  <!-- 内盘亮银 -->
  <circle cx="10" cy="10" r="8.4" fill="url(#silverFace)"/>
  <!-- 内圈细线 -->
  <circle cx="10" cy="10" r="7.4" fill="none" stroke="#2a2f38" stroke-width="0.4" stroke-opacity="0.55"/>
  <!-- 中央铸字 "银" -->
  <text
    x="10"
    y="13.6"
    text-anchor="middle"
    font-family="serif"
    font-size="9"
    font-weight="900"
    fill="#15191f"
  >银</text>
</svg>
