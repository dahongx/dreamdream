<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
  <!--
    Gold ingot — 金元宝。
    经典中式 ingot 剪影：两侧翘耳 + 中间凸起 + 底部弧形船腹。
    金黄色渐变（亮金顶光 → 深金腹底）。
    极小尺寸下轮廓也保持元宝识别度。
  -->
  <defs>
    <linearGradient id="ingotGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="45%" stop-color="#f0c93a"/>
      <stop offset="100%" stop-color="#8a6a14"/>
    </linearGradient>
  </defs>
  <!--
    元宝 path:
      M 2 14         起点：左下船腹
      Q 2 17 5 17    左下弧
      L 15 17        船底直线
      Q 18 17 18 14  右下弧
      L 16 9         右壁斜上
      Q 17 8 15 7    右翘耳外
      Q 13 7 12 8    右翘耳内
      L 8 8          顶面凹槽
      Q 7 7 5 7      左翘耳内
      Q 3 8 4 9      左翘耳外
      Z
  -->
  <path
    d="M 2 14 Q 2 17 5 17 L 15 17 Q 18 17 18 14 L 16 9 Q 17 8 15 7 Q 13 7 12 8 L 8 8 Q 7 7 5 7 Q 3 8 4 9 Z"
    fill="url(#ingotGold)"
    stroke="#4a3608"
    stroke-width="0.6"
    stroke-linejoin="round"
  />
  <!-- 顶面凹槽阴影 -->
  <path
    d="M 8 8 L 12 8 Q 12.5 8.6 12 9 L 8 9 Q 7.5 8.6 8 8 Z"
    fill="#4a3608"
    fill-opacity="0.35"
  />
  <!-- 高光 -->
  <path
    d="M 5 11 Q 7 10.5 9 11"
    fill="none"
    stroke="#fff4c0"
    stroke-width="0.5"
    stroke-opacity="0.7"
    stroke-linecap="round"
  />
</svg>
